<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOON LIST — Cinema Vault</title>

  <!-- PWA: manifest + icons so "Add to Home Screen" opens like a real app -->
  <link rel="manifest" href="./manifest.json?v=moon-ui-v38">
  <link rel="icon" href="./favicon-32.png?v=2" sizes="32x32">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=2">
  <meta name="theme-color" content="#03060f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Moon Movie Flix">

  <!-- Open connections early so fonts / Supabase / CDN don't pay DNS+TLS latency later -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://jkvldbtwpfudiccgqahu.supabase.co" crossorigin>

  <!-- Background image is discovered late when loaded only via CSS — preload it -->
  <link rel="preload" as="image" href="./bg.jpg" fetchpriority="high">

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;0,9..40,900;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css?v=moon-ui-v38">
</head>
<body>

  <div class="bg-layer" aria-hidden="true"></div>
  <div class="orb orb-a" aria-hidden="true"></div>
  <div class="orb orb-b" aria-hidden="true"></div>
  <div class="orb orb-c" aria-hidden="true"></div>
  <div class="noise" aria-hidden="true"></div>

  <header class="topbar">
    <div class="header-inner">

      <div class="hero">
        <div class="hero-text">
          <p class="eyebrow">✦ Personal Cinema Vault</p>
          <h1>🎬MOON Movie Flix</h1>
          <p class="tagline">Movies&nbsp;&bull;&nbsp;Series&nbsp;&bull;&nbsp;Anime&nbsp;&bull;&nbsp;Hidden Picks</p>
        </div>
        <div class="hero-right">
          <span class="badge" id="badge">— 🌸</span>
          <div class="hero-btns">
            <button class="admin-btn" id="adminBtn" onclick="toggleAdmin()">&#128274; </button>
            <button class="section-mgr-btn" id="sectionMgrBtn" onclick="openSectionMgr()" style="display:none" title="Manage Sections">⚙ Sections</button>
            <button class="add-btn" onclick="openModal()"><span>&#65291;</span> Add Movies</button>
          </div>
        </div>
      </div>

      <div class="controls">
        <div class="search-wrap">
          <span class="search-icon" aria-hidden="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          </span>
          <input type="text" id="search" placeholder="Search movies, shows, anime..." autocomplete="off" spellcheck="false">
          <button class="search-clear" id="searchClear" type="button" aria-label="Clear search" style="display:none">✕</button>
        </div>
        <div class="filter-tabs">
         
        </div>
        <div class="sort-icon-wrap">
          <button class="sort-icon-btn" id="sortIconBtn" title="Sort" onclick="toggleSortMenu()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="9" y2="18"/>
            </svg>
          </button>
          <div class="sort-dropdown" id="sortMenu">
            <button class="sort-opt" data-sort="newest">Newest First</button>
            <button class="sort-opt active" data-sort="oldest">Oldest First</button>
            <button class="sort-opt" data-sort="az">A → Z</button>
            <button class="sort-opt" data-sort="za">Z → A</button>
          </div>
        </div>
      </div>

      <div class="section-bar-wrap">
        <button class="sb-arrow sb-arrow-left" id="sbArrowLeft" aria-label="Scroll left">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="section-bar" id="sectionBar"></div>
        <button class="sb-arrow sb-arrow-right" id="sbArrowRight" aria-label="Scroll right">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>

    </div>
  </header>

  <main>
    <section class="stats-grid">
      <div class="stat-card"><span class="stat-num" id="total">0</span><span class="stat-label">Total</span></div>
      <div class="stat-card"><span class="stat-num" id="shown">0</span><span class="stat-label">Showing</span></div>
      <div class="stat-card"><span class="stat-num" id="movieCount">0</span><span class="stat-label">Movies</span></div>
      <div class="stat-card"><span class="stat-num" id="seriesCount">0</span><span class="stat-label">Series</span></div>
      <div class="stat-card"><span class="stat-num" id="animeCount">0</span><span class="stat-label">Anime</span></div>
      <div class="stat-card"><span class="stat-num" id="links">0</span><span class="stat-label">Links</span></div>
    </section>

    <div id="loading" class="skeleton-wrap" aria-label="Loading movies"></div>
    <div id="noRes" class="state-msg" style="display:none"><span class="state-icon">&#127917;</span><span>No title found</span></div>
    <div class="movie-list" id="list"></div>
  </main>

  <!-- ── Add/Edit Movie Modal ── -->
  <div class="ov" id="ov">
    <div class="modal">
      <input type="hidden" id="editId">
      <div class="modal-header">
        <h2 id="modalTitle">Add New Title</h2>
        <button class="modal-close" onclick="closeModal()">&#10005;</button>
      </div>
      <div class="field">
        <label for="newName">Movie / Show Name <span class="req">*</span></label>
        <input type="text" id="newName" placeholder="e.g. Interstellar, Attack on Titan..." onkeydown="if(event.key==='Enter'){event.preventDefault();saveMovie();}">
      </div>
      <div class="field">
        <label for="newUrl">Primary Link <span class="opt">optional</span></label>
        <input type="text" id="newUrl" placeholder="https://..." onkeydown="if(event.key==='Enter'){event.preventDefault();saveMovie();}">
      </div>
      <div class="field">
        <label for="newSection">Section</label>
        <select id="newSection" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();saveMovie();}"></select>
      </div>
      <div class="modal-actions">
        <button class="save-btn" id="saveBtn" onclick="saveMovie()">Add to List</button>
        <button class="cancel-btn" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- ── Links Manager Modal (admin) ── -->
  <div class="ov" id="linksMgrOv">
    <div class="modal modal-wide">
      <div class="modal-header">
        <h2 id="linksMgrTitle">Manage Links</h2>
        <button class="modal-close" onclick="closeLinksMgr()">&#10005;</button>
      </div>

      <div class="lmgr-existing">
        <p class="lmgr-section-label">Current Links</p>
        <div id="linksMgrList"></div>
      </div>

      <div class="lmgr-add">
        <p class="lmgr-section-label">Add New Link</p>
        <div class="lmgr-inputs">
          <input type="text" id="newLinkLabel" placeholder='Label e.g. "480p", "Hindi", "1080p"' style="flex:1;min-width:120px">
          <input type="text" id="newLinkUrl"   placeholder="https://..." style="flex:2;min-width:200px">
          <button class="save-btn lmgr-add-btn" id="addLinkBtn" onclick="addLink()">+ Add Link</button>
        </div>
      </div>

      <div class="modal-actions">
        <button class="cancel-btn" onclick="closeLinksMgr()">Close</button>
      </div>
    </div>
  </div>

  <!-- ── Section Manager Modal (admin) ── -->
  <div class="ov" id="sectionMgrOv">
    <div class="modal modal-wide">
      <div class="modal-header">
        <h2>⚙ Manage Sections <span id="sectionMgrCount" class="lmgr-count-badge"></span></h2>
        <button class="modal-close" onclick="closeSectionMgr()">&#10005;</button>
      </div>

      <div class="lmgr-existing">
        <p class="lmgr-section-label">Current Sections</p>
        <div id="sectionMgrList"></div>
      </div>

      <div class="lmgr-add">
        <p class="lmgr-section-label">Add New Section</p>
        <div class="lmgr-inputs">
          <input type="text" id="newSectionName" placeholder='e.g. "Thriller", "Sci-Fi", "Tamil"' style="flex:1">
          <button class="save-btn lmgr-add-btn" id="addSectionBtn" onclick="addSection()">+ Add Section</button>
        </div>
      </div>

      <div class="modal-actions">
        <button class="cancel-btn" onclick="closeSectionMgr()">Close</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2" defer></script>
  <script src="./config.js?v=moon-ui-v38" defer></script>
  <script src="./app.js?v=moon-ui-v38" defer></script>
</body>
</html>
